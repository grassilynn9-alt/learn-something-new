<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日语完形填空</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="heat">
  <div class="heat-top-wrap">
    <button class="heat-btn" id="refreshBtn">⟳</button>
    <div class="heat-bar">
      <button class="heat-btn" id="yPrev">←</button>
      <span id="yShow">2026</span>
      <button class="heat-btn" id="yNext">→</button>
    </div>
    <button class="heat-btn" id="clearTodayBtn">🗑</button>
  </div>
  <div class="heat-date" id="today"></div>
  <div class="heat-grid" id="heatGrid"></div>
  <div class="heat-info" id="motivation"></div>
</div>

<div class="catalog" id="catalog">
  <h2>📚 文章目录</h2>
  <div id="list"></div>
</div>

<div class="page" id="page">
  <button class="back" onclick="back()">← 返回目录</button>
  <h3 id="title" style="text-align:center;margin-bottom:20px"></h3>
  <div class="text" id="content"></div>
  <div class="score" id="score" style="display:none"></div>
</div>

<button class="check" onclick="check()">Check</button>
<button class="reset-fixed" onclick="reset()">Clear</button>

<script src="script.js"></script>
</body>
</html>
